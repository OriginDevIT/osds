<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OSDS console{% endblock %}</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    h2 { font-size: 1.1rem; margin-top: 1.5rem; }
    label { display: block; margin-top: .75rem; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: .4rem; margin-top: .2rem; box-sizing: border-box; }
    .errors { color: #b00020; margin: .25rem 0; padding-left: 1rem; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    .muted { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>{% block heading %}OSDS installation console{% endblock %}</h1>
  {% block content %}{% endblock %}
</body>
</html>
